name: Build & push image to GHCR

# Every push to main builds the Next.js Docker image, pushes it to
# GitHub Container Registry (ghcr.io), and only then asks Dokploy on the
# Hetzner box to pull `latest` and redeploy. No more on-server nixpacks
# builds filling the disk.
#
# Dokploy's own auto-deploy is OFF, deliberately. See the WHY on the
# "Trigger Dokploy deploy" step: watching git meant deploying three
# minutes before the image existed.
#
# Auth to GHCR uses the built-in GITHUB_TOKEN with `packages: write`.
# The deploy step needs one repo secret, DOKPLOY_DEPLOY_WEBHOOK. The
# published image lives at:
#   ghcr.io/swisssavage/-build.store:latest
#   ghcr.io/swisssavage/-build.store:sha-<commit>
#
# To trigger a manual rebuild without a code change, use the "Run
# workflow" button on the Actions tab (workflow_dispatch below).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one build-and-push at a time per branch. A newer push cancels
  # any in-flight build for the same branch so we always publish the
  # tip of main rather than a stale intermediate commit.
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so GITHUB_TOKEN can push to ghcr.io.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Docker image names must be lowercase, start with an
          # alphanumeric, and not contain "." — so the raw GitHub repo
          # SwissSavage/-BUILD.Store isn't a legal image name. We
          # sanitize: lowercase, strip leading non-alphanumerics, and
          # replace remaining "." with "-". Result: swisssavage/build-store.
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          RAW_REPO=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          CLEAN_REPO=$(echo "$RAW_REPO" | sed 's/^[^a-z0-9]*//' | tr '.' '-')
          IMAGE="ghcr.io/${OWNER}/${CLEAN_REPO}"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
          LATEST_TAG="${IMAGE}:latest"
          echo "tags=${SHA_TAG},${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Cache layers between runs to keep incremental builds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit's provenance metadata is heavy and Dokploy doesn't
          # need it — turn off for a smaller image manifest.
          provenance: false
          # Build-time dummy env vars: Next.js's page data collection
          # imports server modules that read env at load time (db
          # client, Auth.js config, Documenso wrapper). We supply
          # obviously-fake values so imports don't throw during build.
          # None of these connect anywhere — real values are injected
          # at runtime by Dokploy.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            DATABASE_URL=postgres://dummy:dummy@localhost:5432/dummy
            AUTH_SECRET=dummy-build-time-secret-not-used-at-runtime
            AUTH_URL=https://build.afuturemodern.com
            EMAIL_SERVER_HOST=smtp.example.com
            EMAIL_SERVER_PORT=587
            EMAIL_SERVER_USER=dummy
            EMAIL_SERVER_PASSWORD=dummy
            EMAIL_FROM=dummy@example.com
            DOCUMENSO_API_KEY=api_dummy
            DOCUMENSO_WEBHOOK_SECRET=dummy
            GOOGLE_CLIENT_ID=dummy
            GOOGLE_CLIENT_SECRET=dummy

      # ──────────────────────────────────────────────────────────
      # WHY THIS STEP EXISTS (2026-10-05)
      #
      # Dokploy used to auto-deploy off the GitHub push webhook. That
      # webhook fires the moment a commit lands on main, while this
      # workflow is still building, so Dokploy pulled `latest` three
      # minutes before `latest` pointed at the new image. The deploy
      # succeeded, reported green, and shipped the previous commit.
      #
      # Nothing about that looks wrong from the outside, which is why
      # it went unnoticed: merged PR, green Action, green deploy, old
      # code. It also got worse when two merges landed close together,
      # because the concurrency rule above cancels the older build and
      # `latest` can then sit on a stale commit for more than one cycle.
      #
      # Auto-deploy is off in Dokploy now. The deploy is triggered from
      # here instead, after the push has succeeded, so the trigger is
      # the image existing rather than the commit existing. That
      # ordering cannot race.
      #
      # Needs the repo secret DOKPLOY_DEPLOY_WEBHOOK, which is the
      # deploy webhook URL from the Dokploy application settings. The
      # step is skipped rather than failed when the secret is absent,
      # so a fork or a repo without it still builds.
      # ──────────────────────────────────────────────────────────
      - name: Trigger Dokploy deploy
        if: ${{ success() && github.ref == 'refs/heads/main' && env.DOKPLOY_DEPLOY_WEBHOOK != '' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          echo "Image is published. Asking Dokploy to pull and redeploy."
          # --fail so a 4xx/5xx from Dokploy fails the workflow rather
          # than leaving a green run next to a deploy that never ran.
          # Retries cover a brief Dokploy restart; they do not cover a
          # wrong URL, which will exhaust them and fail, as it should.
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy triggered for \`sha-${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy not triggered
        if: ${{ success() && github.ref == 'refs/heads/main' && env.DOKPLOY_DEPLOY_WEBHOOK == '' }}
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          echo "::warning::DOKPLOY_DEPLOY_WEBHOOK is not set. The image was published but nothing was deployed. Redeploy by hand in Dokploy, or add the secret."

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.tags.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.tags.outputs.image }}:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
